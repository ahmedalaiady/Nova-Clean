<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>نوفا كلين | منيو العروض الحصرية - توصيل لكل العراق</title>
<meta name="description" content="نوفا كلين منتجات تنظيف منزلي آمنة وفعّالة. عروض حصرية لفترة محدودة. توصيل لكل محافظات العراق والدفع عند الاستلام.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://novaclean-iq.example.com/">

<meta property="og:type" content="website">
<meta property="og:title" content="نوفا كلين | منيو العروض الحصرية">
<meta property="og:description" content="منتجات تنظيف آمنة وفعّالة. عروض حصرية لفترة محدودة - اطلب الحين وادفع عند الاستلام.">
<meta property="og:image" content="images/menu-header.jpg">
<meta property="og:locale" content="ar_IQ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="page">

  <!-- ============ بوستر تعريفي علوي ============ -->
  <section class="menu-header" id="menu-header">
    <img src="images/menu-header.jpg" alt="نوفا كلين - منيو العروض - منتجات تنظيف آمنة وفعّالة" loading="eager" width="700" height="380">
  </section>

  <!-- ============ شبكة العروض الأربعة ============ -->
  <section class="offers-grid-section" id="offers">
    <div class="offers-grid-2x2">

      <button class="offer-tile" data-offer="العرض الأول - 4 عبوات صغيرة" data-price="33,000 د.ع" type="button">
        <img src="images/offer1-real.jpg" alt="العرض الأول: 4 عبوات صغيرة نوفا كلين بسعر 33,000 دينار" loading="lazy" width="400" height="400">
        <span class="tile-hint"><i class="fa-solid fa-hand-pointer"></i> اضغط للطلب</span>
      </button>

      <button class="offer-tile" data-offer="العرض الثاني - كبيرة وصغيرة" data-price="35,000 د.ع" type="button">
        <img src="images/offer2-real.jpg" alt="العرض الثاني: قطعة كبيرة وقطعة صغيرة نوفا كلين بسعر 35,000 دينار" loading="lazy" width="400" height="400">
        <span class="tile-hint"><i class="fa-solid fa-hand-pointer"></i> اضغط للطلب</span>
      </button>

      <button class="offer-tile" data-offer="العرض الثالث - قطعتين كبيرتين" data-price="40,000 د.ع" type="button">
        <img src="images/offer3-real.jpg" alt="العرض الثالث: قطعتين كبيرتين نوفا كلين بسعر 40,000 دينار" loading="lazy" width="400" height="400">
        <span class="tile-hint"><i class="fa-solid fa-hand-pointer"></i> اضغط للطلب</span>
      </button>

      <button class="offer-tile offer-tile-featured" data-offer="العرض الرابع - الطقم العائلي" data-price="50,000 د.ع" type="button">
        <img src="images/offer4-real.jpg" alt="العرض الرابع: الطقم العائلي نوفا كلين بسعر 50,000 دينار" loading="lazy" width="400" height="400">
        <span class="tile-hint"><i class="fa-solid fa-hand-pointer"></i> اضغط للطلب</span>
      </button>

    </div>

    <p class="offers-note"><i class="fa-solid fa-truck"></i> التوصيل لكل محافظات العراق خلال يومين — الدفع عند الاستلام</p>
  </section>

  <!-- ============ شريط ثقة مصغّر ============ -->
  <section class="mini-trust">
    <div class="mt-item"><i class="fa-solid fa-shield-halved"></i> آمن على الأطفال</div>
    <div class="mt-item"><i class="fa-solid fa-earth-africa"></i> صنع في تركيا</div>
    <div class="mt-item"><i class="fa-solid fa-money-bill-wave"></i> دفع عند الاستلام</div>
  </section>

</main>

<!-- ============ نافذة نموذج الطلب المنبثقة ============ -->
<div class="modal-overlay" id="orderModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>

    <div class="modal-selected-offer" id="modalOfferInfo">
      <span id="modalOfferName"></span>
      <span id="modalOfferPrice"></span>
    </div>

    <form id="orderForm" class="order-form" novalidate>
      <div class="form-group">
        <label for="full_name">الاسم الكامل <span class="required">*</span></label>
        <input type="text" id="full_name" name="full_name" placeholder="مثال: أحمد محمد علي" required>
        <span class="error-msg" id="err-full_name"></span>
      </div>

      <div class="form-group">
        <label for="phone">رقم الهاتف <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="07xxxxxxxxx" required>
        <span class="error-msg" id="err-phone"></span>
      </div>

      <div class="form-group">
        <label for="governorate">المحافظة <span class="required">*</span></label>
        <select id="governorate" name="governorate" required>
          <option value="" disabled selected>اختر محافظتك</option>
          <option>بغداد</option>
          <option>البصرة</option>
          <option>نينوى</option>
          <option>أربيل</option>
          <option>النجف</option>
          <option>كربلاء</option>
          <option>الأنبار</option>
          <option>ديالى</option>
          <option>ذي قار</option>
          <option>بابل</option>
          <option>واسط</option>
          <option>ميسان</option>
          <option>المثنى</option>
          <option>القادسية</option>
          <option>صلاح الدين</option>
          <option>كركوك</option>
          <option>دهوك</option>
          <option>السليمانية</option>
        </select>
        <span class="error-msg" id="err-governorate"></span>
      </div>

      <div class="form-group">
        <label for="address">المنطقة <span class="required">*</span></label>
        <textarea id="address" name="address" rows="2" placeholder="المنطقة السكنية" required></textarea>
        <span class="error-msg" id="err-address"></span>
      </div>

      <input type="hidden" id="offer_selected" name="offer_selected">

      <button type="submit" class="btn btn-primary btn-large btn-full" id="submitBtn">
        <i class="fa-solid fa-check"></i> تثبيت الطلب الآن
      </button>
      <p class="form-note"><i class="fa-solid fa-lock"></i> بياناتك تستخدم فقط لتأكيد وتوصيل طلبك.</p>
    </form>

    <div class="order-success" id="orderSuccess" hidden>
      <i class="fa-solid fa-circle-check"></i>
      <h3>تم استلام طلبك بنجاح!</h3>
      <p>راح يتواصل وياك فريقنا قريباً لتأكيد الطلب. تكدر كذلك تراسلنا مباشرة عبر واتساب لتسريع الطلب.</p>
      <div class="success-actions">
        <a href="#" id="waLink" target="_blank" class="btn btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> تواصل واتساب</a>
      </div>
    </div>
  </div>
</div>

<!-- زر واتساب عائم -->
<a href="#" id="floatingWa" class="floating-whatsapp" target="_blank" aria-label="تواصل معنا عبر واتساب">
  <i class="fa-brands fa-whatsapp"></i>
  <span class="floating-whatsapp-label">تواصل واتساب</span>
</a>

<script src="js/main.js"></script>
</body>
</html>
